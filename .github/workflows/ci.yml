name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.1

jobs:
  native:
    name: Rust and Web / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ env.RUST_VERSION }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked
      - name: Build native executable
        run: cargo build --locked --release
      - name: Verify executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./target/release/picsoc.exe --version
          else
            ./target/release/picsoc --version
          fi
      - name: Exercise native API and persistence
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            python tests/api_smoke.py --binary target/release/picsoc.exe
          else
            python3 tests/api_smoke.py --binary target/release/picsoc
          fi

  debian:
    name: Rust and Web / Debian 12
    runs-on: ubuntu-22.04
    container: rust:1.96.1-bookworm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python for API tests
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3
          rm -rf /var/lib/apt/lists/*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: ./target/release/picsoc --version
      - run: python3 tests/api_smoke.py --binary target/release/picsoc

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build Debian runtime image
        run: docker build --target runtime --tag picsoc:ci .
      - name: Verify unprivileged image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' picsoc:ci)" = '10001:10001'
          docker run --rm picsoc:ci --version
      - name: Smoke test embedded Web and API
        run: |
          set -euo pipefail
          docker run --detach --name picsoc-ci --publish 127.0.0.1:3210:3210 picsoc:ci
          trap 'docker logs picsoc-ci; docker rm --force picsoc-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3210/api/health > /tmp/picsoc-health.json; then
              break
            fi
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("/tmp/picsoc-health.json")); assert d["ok"] is True'
          curl --fail --silent http://127.0.0.1:3210/ > /tmp/picsoc-index.html
          python3 -c 'from pathlib import Path; assert "<html" in Path("/tmp/picsoc-index.html").read_text().lower()'
