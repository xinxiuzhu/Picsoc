services:
  picsoc:
    image: picsoc:local
    build:
      context: .
      target: runtime
    user: "10001:10001"
    ports:
      - "127.0.0.1:3210:3210"
    command: ["--data-dir", "/data", "--bind", "0.0.0.0:3210", "--no-open"]
    volumes:
      - type: bind
        source: ./picsoc-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./library
        target: /library
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
