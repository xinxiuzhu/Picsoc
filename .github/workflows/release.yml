name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.1

jobs:
  packages:
    name: Package / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            kind: windows
          - name: Debian 12 x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            kind: linux
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            kind: macos
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
            kind: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            python_command=python
          fi
          "$python_command" - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match Cargo.toml package version')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.kind != 'linux'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Web frontend
        if: matrix.kind != 'linux'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Rust
        if: matrix.kind != 'linux'
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ env.RUST_VERSION }}
      - name: Check and test native targets
        if: matrix.kind != 'linux'
        env:
          PICSOC_FRONTEND_PREBUILT: '1'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify standalone Windows runtime
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/verify-windows-runtime.ps1 -Binary target/${{ matrix.target }}/release/picsoc.exe
      - name: Exercise native API and persistence
        if: matrix.kind != 'linux'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            python tests/api_smoke.py --binary "target/$RELEASE_TARGET/release/picsoc.exe"
          else
            python3 tests/api_smoke.py --binary "target/$RELEASE_TARGET/release/picsoc"
          fi
      - name: Test in Debian 12
        if: matrix.kind == 'linux'
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/build" --workdir /build node:22-bookworm-slim sh -c 'cd frontend && npm ci && npm run build'
          docker run --rm --env PICSOC_FRONTEND_PREBUILT=1 --volume "$GITHUB_WORKSPACE:/build" --workdir /build rust:1.96.1-bookworm bash -c 'apt-get update && apt-get install --yes --no-install-recommends python3 && rustup component add rustfmt clippy && cargo fmt --all --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --locked --release && python3 tests/api_smoke.py --binary target/release/picsoc'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: matrix.kind == 'linux'
      - name: Export Debian-built executable
        if: matrix.kind == 'linux'
        run: docker buildx build --target binary --output type=local,dest=release-bin .
      - name: Package Unix executable
        if: matrix.kind != 'windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_LABEL: ${{ matrix.label }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          package_name="picsoc-${RELEASE_TAG}-${RELEASE_LABEL}"
          mkdir -p "release-packages/$package_name"
          if [[ "$RELEASE_KIND" == 'linux' ]]; then
            cp release-bin/picsoc "release-packages/$package_name/picsoc"
          else
            cp "target/$RELEASE_TARGET/release/picsoc" "release-packages/$package_name/picsoc"
          fi
          chmod +x "release-packages/$package_name/picsoc"
          if [[ "$RELEASE_KIND" == 'linux' ]]; then
            docker run --rm --volume "$GITHUB_WORKSPACE/release-packages/$package_name:/release:ro" debian:bookworm-slim /release/picsoc --version
          else
            "release-packages/$package_name/picsoc" --version
          fi
          cp LICENSE "release-packages/$package_name/LICENSE"
          cp docs/RELEASE-README.md "release-packages/$package_name/README.md"
          cp docs/RELEASE-README.en.md "release-packages/$package_name/README.en.md"
          tar -czf "release-packages/$package_name.tar.gz" -C release-packages "$package_name"
      - name: Package Windows executable
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_LABEL: ${{ matrix.label }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "picsoc-$env:RELEASE_TAG-$env:RELEASE_LABEL"
          $packageDir = "release-packages/$packageName"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/picsoc.exe" "$packageDir/picsoc.exe"
          & "$packageDir/picsoc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed' }
          Copy-Item LICENSE "$packageDir/LICENSE"
          Copy-Item docs/RELEASE-README.md "$packageDir/README.md"
          Copy-Item docs/RELEASE-README.en.md "$packageDir/README.en.md"
          Compress-Archive -Path $packageDir -DestinationPath "release-packages/$packageName.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.label }}
          path: |
            release-packages/*.tar.gz
            release-packages/*.zip
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-packages
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-packages
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-packages/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            prerelease_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease_args=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-packages/* --verify-tag --generate-notes --title "Picsoc $RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${prerelease_args[@]}"
          fi

  container:
    name: Publish Docker image
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set image tags
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          {
            printf 'tags<<EOF\n%s:%s\n' "$image_name" "$version"
            if [[ "$version" != *-* ]]; then
              printf '%s:latest\n' "$image_name"
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
